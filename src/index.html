<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HugMesh Tube (remote)</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Standalone dev-shell chrome. In production the hugmesh.net host owns the
       document <title>/favicon; these give the `ng serve tube` dev shell a brand
       colour + description instead of the bare browser default. -->
  <meta name="description" content="HugMesh Tube (LocalTube) — subscribe, queue and watch your own channel downloads within the HugMesh platform." />
  <meta name="theme-color" content="#0a0a12" />
  <!-- Runtime theme (fleet 50-snap-theme.sh mechanism): RELATIVE href so it
       resolves under this app's mount behind the gateway; the file's
       :root:root block out-specifies the compiled :root fallbacks regardless
       of stylesheet order. Empty when unthemed (zero-byte 200, no 404). -->
  <link rel="stylesheet" href="snap-theme.css">
</head>
<body>
  <hug-tube-root></hug-tube-root>
</body>
</html>
