# Per-response CSP nonce source. nginx has no built-in random generator, so we
# reuse $request_id (a unique 32-hex-char token generated fresh for every
# request): unguessable and different on each response, i.e. a sound nonce. The
# `map` exposes it as $cspnonce, which is injected into BOTH the script-src
# directive AND every <script> tag of index.html (sub_filter below) so the two
# ALWAYS agree for a given response.
#
# Scope note: this file is COPYed to /etc/nginx/conf.d/default.conf (see the
# Dockerfile), which the stock image includes from INSIDE the http block, so a
# bare `map` at file top is legal here (it is an http-level directive).
map $request_id $cspnonce {
    default $request_id;
}

server {
    # :8080 to match the federation-api tube module registration
    # remote_entry_url = http://hugmesh-tube-ui:8080/remoteEntry.json.
    # nginx-unprivileged listens on 8080 by default (non-root).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + the
    # Google-connect redirect flow: none of these block same-origin scripts,
    # cross-origin script-based federation, or the full-page navigation to
    # Google's consent screen (top-level navigation is not CSP-restricted).
    # Emitted with `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. Consistent with the CSP
    #     `frame-ancestors 'none'` below — the hugmesh.net host loads this
    #     remote via <script> (native federation), NEVER via <iframe>, so denying
    #     framing entirely does not weaken federation.
    #   - Referrer-Policy: don't leak full URLs cross-origin (the signed media
    #     URLs carry ?sig=/&sub= — keep them off cross-origin referers).
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    #
    # ── Cross-Origin-* + Permissions-Policy (issue #3) ────────────────────────
    # These three were the outstanding half of "stricter headers deferred": the
    # CSP below has shipped since the first public release, but nginx.conf sent
    # no Cross-Origin-* and no Permissions-Policy at all. Each value below was
    # CHOSEN AGAINST WHAT THIS APP ACTUALLY LOADS, then MEASURED in headless
    # Chromium 149 — the "obvious" strict value breaks the app in two of the
    # three cases, so none of these is a copy of another repo's file.
    #
    #   - Cross-Origin-Embedder-Policy: credentialless — NOT require-corp.
    #     This UI loads Google channel avatars cross-origin as plain no-cors
    #     <img> (tube-my.component.html binds [attr.src]="s.thumbnailUrl" to the
    #     Google-supplied URL, host rotating over yt3.ggpht.com /
    #     *.googleusercontent.com — hence `img-src https:` in the CSP). Those
    #     hosts do NOT promise a CORP header, and under `require-corp` every one
    #     of them is blocked: measured as
    #     `net::ERR_BLOCKED_BY_RESPONSE.NotSameOriginAfterDefaultedToSameOriginByCoep`
    #     with the avatars gone from the subscriptions panel. `credentialless`
    #     re-requests those no-cors subresources WITHOUT credentials instead of
    #     demanding CORP, so the public avatars still load (measured: they do)
    #     while cross-origin isolation is still achieved (measured:
    #     `self.crossOriginIsolated === true` with the COOP below). Nothing here
    #     needs isolation today — no wasm, no SharedArrayBuffer, no worker — so
    #     this is defence-in-depth, and the credential-stripping is free
    #     precisely because every credentialed call this UI makes
    #     (/bff/tube/**) is CORS-mode, which COEP does not touch.
    #     TRIPWIRE: if a cross-origin subresource ever needs COOKIES (an avatar
    #     CDN behind auth, a cross-origin <video>), credentialless will strip
    #     them and it will 401/403 — move that resource same-origin, do not
    #     relax the header.
    #   - Cross-Origin-Opener-Policy: same-origin — safe here because the
    #     Google-connect flow is a TOP-LEVEL navigation
    #     (`window.location.assign(authorizeUrl)`, tube-my.component.ts), not a
    #     popup: this UI never calls window.open and never touches
    #     window.opener, so severing the opener costs nothing. It is also what
    #     hugmesh-gateway already writes for responses that lack it, and it is
    #     required for COEP to mean anything — COEP alone grants no isolation.
    #   - Cross-Origin-Resource-Policy: cross-origin — deliberately the
    #     permissive value, because THIS SERVER IS A FEDERATION REMOTE: its
    #     whole job is to be loaded by another document. hugmesh-gateway's
    #     SecurityConfig records the exact reason ("COEP: require-corp is
    #     DELIBERATELY NOT enabled — would break module-federation remote
    #     loading until the remotes are CORP-tagged"); this header IS that
    #     tagging, and it unblocks the host from turning COEP on later.
    #     Measured, host-side: with a `require-corp` embedder a remote WITHOUT
    #     CORP has its no-cors subresources blocked, and `cross-origin` is what
    #     restores them. It gives nothing away: an absent CORP is already
    #     permissive for every non-COEP embedder, and framing is refused
    #     independently by X-Frame-Options + `frame-ancestors 'none'`.
    #     Do NOT "tighten" this to same-origin/same-site: measured, neither
    #     value buys anything here (CORP does not govern CORS-mode requests, so
    #     the remoteEntry.json fetch and the module imports are unaffected
    #     either way) while both re-break the host's future COEP.
    #   - Permissions-Policy: deny every powerful feature this UI does not use,
    #     and keep the THREE the <video> player needs. autoplay=(self) —
    #     tube-my.component.html sets the `autoplay` attribute on the player;
    #     `autoplay=()` denies EVERY origin INCLUDING self and the video would
    #     never start. fullscreen=(self) and picture-in-picture=(self) — the
    #     browser's own <video controls> chrome exposes both buttons; `()` on
    #     either removes/errors that control. picture-in-picture defaults to
    #     `*`, so naming it (self) is a real tightening, while autoplay and
    #     fullscreen default to `self` and are named to PIN them against a
    #     careless `()`. camera/microphone are `()` here (unlike the gateway's
    #     `(self)`, which exists for matrix-ui's WebRTC calls) — Tube has no
    #     capture surface. Every feature name in the list was verified
    #     recognised by Chromium 149: an unknown name logs
    #     "Unrecognized feature" as a console ERROR, which would make this
    #     header a permanent source of console noise.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.net host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # Content-Security-Policy (strong, nonce-based XSS backstop). WHY THIS EXISTS:
    # the gateway emits a blanket fallback CSP (`script-src 'self'`) for any UI
    # that sends none of its own, and that fallback BLOCKS the inline
    # `<script type="esms-options">` tag Angular native-federation writes into
    # index.html. Without it es-module-shims is never configured, the
    # `type="module-shim"` main bundle never runs, Angular never bootstraps, and
    # /tube/ renders a blank page. Sending our OWN nonce-based CSP (upstream wins
    # over the gateway fallback) fixes that WITHOUT weakening script-src: there is
    # NO 'unsafe-inline'/'unsafe-hashes' here — only the per-response nonce, which
    # es-module-shims (2.8.1) auto-propagates to the module scripts it injects.
    # Tuned to what THIS remote's source actually does (src/app/**):
    #   - default-src 'self'                        : same-origin default for
    #                                                 everything not named below.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only the nonce'd bootstrap
    #                                                 scripts we shipped run;
    #                                                 blob: is required because
    #                                                 es-module-shims executes
    #                                                 rewritten modules from blob:
    #                                                 URLs. NO 'wasm-unsafe-eval'
    #                                                 — this UI ships no wasm
    #                                                 (package.json has no wasm/
    #                                                 codec dep; the player is a
    #                                                 plain <video> element).
    #   - style-src 'self' 'unsafe-inline' blob:    : Angular injects component
    #                                                 styles as runtime <style>
    #                                                 elements which cannot carry
    #                                                 a nonce, so 'unsafe-inline'
    #                                                 is REQUIRED for styles.
    #   - img-src 'self' data: https:               : channel avatars come from
    #                                                 Google's CDN — the
    #                                                 subscriptions panel binds
    #                                                 <img [attr.src]> straight to
    #                                                 the Google-supplied
    #                                                 thumbnailUrl (tube-my.component
    #                                                 .html), whose host rotates
    #                                                 (yt3.ggpht.com /
    #                                                 googleusercontent), hence
    #                                                 scheme-wide https:.
    #   - font-src 'self' data:                     : webfonts incl. inlined data:
    #                                                 (the token stacks are system
    #                                                 fonts today; kept for the
    #                                                 build's inlining).
    #   - media-src 'self'                          : VIDEO. The watch cards set
    #                                                 <video src> to the short-TTL
    #                                                 signed URL from
    #                                                 GET /bff/tube/media/sign,
    #                                                 which the BFF builds as the
    #                                                 ROOT-RELATIVE, SAME-ORIGIN
    #                                                 path
    #                                                 /tube/content/<path>?sig=…
    #                                                 (TubeMediaController) served
    #                                                 by the gateway → the media
    #                                                 sidecar. Progressive MP4
    #                                                 only: no HLS/MSE/blob: object
    #                                                 URLs anywhere in src (no
    #                                                 createObjectURL, no
    #                                                 MediaSource, no hls.js dep),
    #                                                 so blob: is deliberately NOT
    #                                                 granted here. Without an
    #                                                 explicit media-src the
    #                                                 default-src fallback would
    #                                                 still allow it, but naming it
    #                                                 pins the player's contract.
    #   - connect-src 'self' blob: https:           : the typed /bff/tube/** clients
    #                                                 call same origin (generated
    #                                                 rootUrl = ''), but TUBE_BASE_URL
    #                                                 is overridable at runtime via
    #                                                 globalThis.__HUG_TUBE_URL__,
    #                                                 so the BFF origin is
    #                                                 env-configured. NO wss: — this
    #                                                 UI opens no WebSocket and no
    #                                                 EventSource (queue state is
    #                                                 read by plain HttpClient GETs).
    #                                                 `blob:` is REQUIRED, not
    #                                                 precautionary: es-module-shims
    #                                                 FETCHES the modules it shims
    #                                                 from blob: URLs, so dropping it
    #                                                 to match a tidier comment
    #                                                 silently breaks the loader.
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : deny all framing of this app
    #                                                 (mirrors X-Frame-Options DENY).
    # No worker-src / frame-src are granted: this remote creates no web or service
    # worker and embeds no iframe, so both correctly fall back to default-src 'self'.
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards ALL inherited ones — so the CSP + security header set is
    # repeated in every location below.
    # Runtime theme (fleet 50-hug-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's HUG_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    #
    # LEGACY PATH, KEPT DELIBERATELY (RENAME PHASE 3). /hug-theme.css below is
    # now the canonical name and this image's index.html asks for that one. This
    # block stays for the two readers that can still ask for the old name: an
    # index.html baked into an image built before this commit, and a browser
    # replaying a cached document. The hook writes BOTH files byte-for-byte, so
    # the two URLs are the same bytes and neither can 404.
    #
    # RETIRE WHEN: every image in the fleet has been rebuilt from a tree
    # containing this commit AND no cached document can still reference the old
    # name. The stylesheet itself is served no-store, so it is the *documents*
    # that pin it, not the stylesheet — one release cycle (~30 days) is a
    # comfortable window. Deleting this block early costs a silently unthemed
    # page, which is the exact failure this whole migration is sequenced to
    # avoid, so err long.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # CANONICAL PATH (RENAME PHASE 3). index.html <link>s this name, and
    # docker-entrypoint.d/50-hug-theme.sh writes it as its PRIMARY output.
    # Directives mirror the legacy block above exactly — same no-store, same
    # re-emitted security headers — because the two URLs really are the same
    # bytes under two names, and a reader must not be able to tell which one
    # they asked for from anything except the path.
    location = /hug-theme.css {
        alias /tmp/hug-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : the built index.html has SEVERAL script tags
        #                           (the inline `type="esms-options"` block, the
        #                           es-module-shims loader, the `type="module-shim"`
        #                           main bundle) — rewrite ALL of them.
        #   - sub_filter_types text/html : ONLY rewrite the HTML document; the JS
        #                           bundles (which can legitimately contain the
        #                           literal "<script") stay byte-for-byte intact.
        # NB: do NOT enable gzip_static / ship a precompressed index.html —
        # sub_filter cannot rewrite an already-compressed body, which would leave
        # the script tags un-nonced and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # NOTE: this location has its own add_header, which makes nginx DROP the
        # server-scope add_headers above for responses served here. Re-declare the
        # security headers so SPA/federation responses keep them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: https:; font-src 'self' data:; media-src 'self'; connect-src 'self' blob: https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        # Content-Type via default_type, NOT add_header. `add_header Content-Type`
        # APPENDS: nginx has already set one from default_type (the stock
        # application/octet-stream) by the time the response is filtered, so the
        # health endpoint went out with the field TWICE —
        #   Content-Type: application/octet-stream
        #   Content-Type: text/plain
        # `default_type` REPLACES the default rather than appending, so exactly
        # one `Content-Type: text/plain` is emitted (verified: 1 header, body
        # `ok`, all eight security headers still present).
        #
        # WHAT THAT DUPLICATE DID AND DID NOT DO — measured, four ways, against
        # nginxinc/nginx-unprivileged:1.27-alpine serving this exact file, with
        # headless Chromium 149 and with curl:
        #   pre-fix (2 fields, nosniff ON)  -> document.contentType text/plain,
        #                                      body `ok`, NO download
        #   post-fix (default_type)         -> text/plain, `ok`, no download
        #   pre-fix with nosniff REMOVED    -> IDENTICAL to pre-fix
        #   CONTROL: no type declared at all-> application/octet-stream, and
        #                                      Chromium DOES download it
        #                                      (page.goto fails with
        #                                      "Download is starting",
        #                                      suggestedFilename "healthz")
        # So: browsers resolve the LAST Content-Type, not the first (Fetch's
        # "extract a MIME type" overwrites its result for every field value, and
        # Chromium implements that; curl agrees, %{content_type} = text/plain),
        # and `X-Content-Type-Options: nosniff` plays NO part in the choice —
        # removing it changes nothing. The duplicate was therefore a spec-hygiene
        # defect, not a user-visible break; an earlier revision of this comment
        # claimed it produced a download prompt, and that claim was wrong.
        # The download IS real for the CONTROL case, which is why the companion
        # guard below pins `default_type text/plain;` as well: deleting the type
        # declaration to satisfy "no add_header Content-Type" is the mutation
        # that actually breaks /healthz.
        #
        # NOTE: this location declares add_headers of its own, which makes nginx
        # DROP the server-scope add_headers for this response. Re-declare the
        # security headers so the health endpoint keeps them too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        default_type text/plain;
    }
}
